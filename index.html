<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>팽이 치기 · 동시 돌진</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#14171c;color:#f3eee2;--blue:#64d5f4;--red:#ff896b;--muted:#a8a9a5}
*{box-sizing:border-box}
body{margin:0;min-width:270px}
button{font:inherit;color:inherit;cursor:pointer}
.stage{position:relative;isolation:isolate;overflow:hidden;height:100dvh;background:#181c22;--hud-top:max(8px,env(safe-area-inset-top));--hud-left:max(8px,env(safe-area-inset-left));--hud-right:max(8px,env(safe-area-inset-right));--score-height:clamp(44px,9dvh,82px);--hud-row:calc(var(--hud-top) + var(--score-height) + 6px);--bottom-inset:max(8px,env(safe-area-inset-bottom))}
.fighter-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
button{font-size:clamp(12px,2.7vh,15px);font-weight:750}
.version{position:absolute;right:var(--hud-right);bottom:var(--bottom-inset);color:#f3eee2;opacity:.45;font-size:11px;font-weight:700;pointer-events:none}
.score{position:absolute;inset:var(--hud-top) var(--hud-right) auto var(--hud-left);height:var(--score-height);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:clamp(6px,2.5vw,32px);background:#1c2026;border:1px solid #353b40;padding:0 clamp(7px,2vw,24px);border-radius:12px;pointer-events:none}
.fighter{min-width:0;color:var(--blue)}
.fighter.red{color:var(--red);text-align:right}
.red .fighter-head{flex-direction:row-reverse}
.name{font-size:clamp(13px,3.1vh,19px);font-weight:900;white-space:nowrap}
.hp{font:750 clamp(11px,2.7vh,15px)/1.1 ui-monospace,monospace;color:#f3eee2;white-space:nowrap}
.track{height:clamp(5px,1.35vh,10px);background:#343943;border-radius:3px;margin-top:4px;overflow:hidden}
.fill{height:100%;width:100%;background:currentColor;transition:width .18s ease}
.red .fill{margin-left:auto}
.shot-clock{display:flex;align-items:center;justify-content:center;min-width:clamp(38px,9vw,64px);padding:2px 4px;border:1px solid #62737d;border-radius:8px;background:#121a24e8;color:#c9e9f1;font-size:11px;font-weight:750;white-space:nowrap}
.shot-clock strong{font-size:clamp(22px,5.5vh,30px);font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
.shot-clock[data-urgent="true"]{color:#ffc087;border-color:#e08e64}
.shot-clock[hidden]{display:flex;visibility:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.result{position:absolute;inset:0;display:grid;place-content:center;text-align:center;justify-items:center;background:#0f13198e}
.result[hidden]{display:none}
.result strong:not([hidden]){font-size:clamp(28px,9vh,70px);font-weight:950;letter-spacing:-.08em;text-shadow:0 3px 20px #10141b}
.result button{margin-top:8px}
.tutorial{position:absolute;inset:var(--hud-row) calc(max(var(--hud-left),var(--hud-right)) + 84px) auto;display:grid;justify-items:center;text-align:center;pointer-events:none}
.tutorial[hidden]{display:none}
.tutorial:has(> button:not([hidden]),> .tutorial-actions){bottom:var(--bottom-inset);align-content:start}
.tutorial > button,.tutorial-actions{position:absolute;bottom:0}
.tutorial-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.stage:has(:is(#tutorialIntro,#tutorialConfirm):not([hidden])) > :is(.score,.hud-button,.version){filter:brightness(.32)}
.tutorial button{pointer-events:auto}
.tutorial-copy{display:grid;gap:3px;padding:6px 12px;border:1px solid #62737d;border-radius:8px;background:#121a24ee;color:#f3eee2;font-size:clamp(12px,3vh,16px);line-height:1.25}
.tutorial-copy span{color:#c9e9f1}
.challenge-text{margin-top:4px;font-size:12px;font-weight:750;color:#d6c7aa}
button{min-height:42px;padding:0 clamp(10px,2vw,19px);border-radius:8px;border:1px solid #4a4f57;background:#242930;white-space:nowrap;touch-action:manipulation}
button:hover{background:#343b44}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.primary{background:#ebe0bd;color:#202126;border-color:#ebe0bd}
.primary:hover{background:#fff0c8}
.hud-button{position:absolute;top:var(--hud-row);z-index:2;min-height:40px;padding:0 10px;font-size:12px;color:#ced8dc}
.fast-mode{right:var(--hud-right)}
.fullscreen{left:var(--hud-left)}
.hud-button[aria-pressed="true"]{background:#183947;border-color:#64d5f4;color:#d3f4ff}
.fullscreen-status{position:absolute;top:calc(var(--hud-row) + 46px);left:var(--hud-left);max-width:calc(100% - var(--hud-left) - var(--hud-right));z-index:3;margin:0;padding:6px 9px;border-radius:8px;background:#121a24ee;font-size:12px;pointer-events:none}
.fullscreen-status:empty{display:none}
.stage:fullscreen{width:100%;height:100%}
.fast-mode-guide{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:#000c;text-align:center}
.fast-mode-guide[hidden]{display:none}
.fast-mode-guide .tutorial-copy{gap:6px}
.fast-mode-guide small{color:var(--muted);font-size:.85em}
.stage:has(.fast-mode-guide:not([hidden])) .fast-mode{z-index:6;outline:2px solid var(--blue);outline-offset:3px}
.fast-mode-arrow{display:none}
.stage:has(.fast-mode-guide:not([hidden])) .fast-mode-arrow{display:block;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);color:var(--blue);font-size:32px;line-height:1;pointer-events:none}
.tactic-cue{position:absolute;top:50%;right:var(--hud-right);z-index:3;width:min(300px,60vw,50dvh);transform:translateY(-50%);pointer-events:none;text-align:center}
.tactic-cue img{display:none;width:100%;height:auto;filter:drop-shadow(0 3px 5px #0009)}
.tactic-cue:is([data-cue="dodge"],[data-cue="lead"]) .cue-try,.tactic-cue[data-cue="success"] .cue-success,.tactic-cue[data-cue="fail"] .cue-fail,.tactic-cue[data-cue="missed"] .cue-missed{display:block;animation:tactic-cue-in .14s ease-out}
.tactic-caption{margin:0;color:#fff4d8;font-size:clamp(21px,8vw,38px);font-weight:900;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 1px 2px #000,0 2px 5px #000}
.tactic-caption:not(:empty){margin-top:6px}
@keyframes tactic-cue-in{from{opacity:0;transform:translateX(12px)}}
@media(max-width:480px){.tutorial{top:calc(var(--hud-row) + 46px);left:var(--hud-left);right:var(--hud-right)}}
@media(max-width:420px){.fighter-head{flex-wrap:wrap;row-gap:0}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}.tactic-cue img{animation:none!important}}
</style>
</head>
<body>
<main class="stage" aria-label="팽이 치기">
  <canvas id="arena" aria-label="경기장. 터치한 곳을 기준으로 원하는 방향으로 밀었다 놓으면 두 팽이가 돌진합니다."></canvas>
  <button type="button" id="fullscreen" class="hud-button fullscreen" aria-pressed="false">전체 화면</button>
  <p id="fullscreenStatus" class="fullscreen-status" role="status"></p>
  <button type="button" id="fastMode" class="hud-button fast-mode" aria-pressed="false" hidden>배속 모드<span class="fast-mode-arrow" aria-hidden="true">↑</span></button>
  <section class="score" aria-label="대전 현황">
    <div class="fighter"><div class="fighter-head"><span class="name">교주의 팽이</span><span id="blueHp" class="hp">100 HP</span></div><div class="track"><div id="blueFill" class="fill"></div></div></div>
    <div id="shotClock" class="shot-clock" role="timer" aria-label="팽이를 치기까지 남은 초" hidden><strong id="shotSeconds">10</strong></div>
    <div class="fighter red"><div class="fighter-head"><span class="name">칸타의 팽이</span><span id="redHp" class="hp">100 HP</span></div><div class="track"><div id="redFill" class="fill"></div></div></div>
  </section>
  <div id="tutorialIntro" class="tutorial" hidden>
    <div class="tutorial-copy"><strong id="tutorialIntroText" aria-live="polite">이것은 교주의 팽이입니다</strong></div>
    <div class="tutorial-actions">
      <button type="button" id="tutorialNext" class="primary">확인</button>
      <button type="button" id="tutorialSkip">튜토리얼 건너뛰기</button>
    </div>
  </div>
  <div id="tutorialPractice" class="tutorial" hidden>
    <div class="tutorial-copy">

      <span><span id="tutorialGoal">내 팽이를 쳐서 칸타의 팽이를 3번 벽에 부딪히게 하기</span> <b id="tutorialProgress" aria-live="polite">0/3</b></span>
    </div>
    <button type="button" id="tutorialConfirm" class="primary" hidden>확인</button>
  </div>
  <div id="ready" class="result">
    <strong id="tutorialSuccess" role="status" hidden>튜토리얼 성공</strong>
    <span id="challengeIntro" class="challenge-text">세 판 연속 승리하면 클리어</span>
    <button id="begin" class="primary">게임 시작</button>
  </div>
  <div id="result" class="result" hidden><strong id="verdict" role="status"></strong><span id="resultProgress" class="challenge-text"></span><button id="rematch" class="primary">다시하기</button></div>

const canvas = document.querySelector('#arena');
const stage = document.querySelector('.stage');
const fullscreenButton = document.querySelector('#fullscreen');
const fullscreenStatus = document.querySelector('#fullscreenStatus');
const score = document.querySelector('.score');
const fastModeButton = document.querySelector('#fastMode');
const fastModeGuide = document.querySelector('#fastModeGuide');
const tacticCue = document.querySelector('#tacticCue');
const tacticCaption = document.querySelector('#tacticCaption');
const ctx = canvas.getContext('2d');
const ready = document.querySelector('#ready');
const beginButton = document.querySelector('#begin');
const tutorialSuccess = document.querySelector('#tutorialSuccess');
const challengeIntro = document.querySelector('#challengeIntro');
const result = document.querySelector('#result');
const verdict = document.querySelector('#verdict');
const rematchButton = document.querySelector('#rematch');
const shotClock = document.querySelector('#shotClock');
const shotSeconds = document.querySelector('#shotSeconds');
const resultProgress = document.querySelector('#resultProgress');
const tutorialIntro = document.querySelector('#tutorialIntro');
const tutorialIntroText = document.querySelector('#tutorialIntroText');
const tutorialNext = document.querySelector('#tutorialNext');
const tutorialSkip = document.querySelector('#tutorialSkip');
const tutorialPractice = document.querySelector('#tutorialPractice');
const tutorialConfirm = document.querySelector('#tutorialConfirm');
const tutorialInstruction = document.querySelector('#tutorialInstruction');
const tutorialGoal = document.querySelector('#tutorialGoal');
const tutorialProgress = document.querySelector('#tutorialProgress');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const TAU = Math.PI * 2;
const MAX_HP = 100;
const RADIUS = 26;
const ARENA_RADIUS = 225;
const WALL_RADIUS = ARENA_RADIUS - RADIUS - 6;
const FIXED_STEP = 1 / 120;
const JOYSTICK_DEAD_ZONE = 7;
const CHARGE_SLOW_RATE = .20;
const SHOT_WINDOW = 10;
const PATH_PREVIEW_SECONDS = 2;
const TACTIC_CUE_SECONDS = 1.5;
const TACTIC_CAPTIONS = {
  dodge: '칸타가 당신의 공격을 회피한다!',
  lead: '칸타가 당신의 회피를 예측했다!',
  missed: '칸타의 회피를 예측했다!',
  success: '성공!',
  fail: '실패!'
};
const WINS_TO_CLEAR = 3;
const TUTORIAL_HITS = 3;
const PLAYER_STRIKE_INTERVAL = .72;
const WALL_DAMAGE_SPEED = 180;
const DODGE_WALL_MARGIN = 18;
const PLAYER_DASH_DRAG = 1.15;
const IDLE_DRAG = 5.5;
const palette = [
  { light:'#a7efff', bright:'#64d5f4', mid:'#2d97b8', dark:'#174760', name:'교주의 팽이' },
  { light:'#ffceb4', bright:'#ff896b', mid:'#c75942', dark:'#623324', name:'칸타의 팽이' }
];
const hud = [
  [document.querySelector('#blueHp'), document.querySelector('#blueFill')],
  [document.querySelector('#redHp'), document.querySelector('#redFill')]
];
const random = (min, max) => min + Math.random() * (max - min);
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

let tops, round, sparks, hits, rings;
let drawWidth = 0, drawHeight = 0, scale = 1, density = 1;
let arenaCenterY = 0;
let joystickRadius = 64;
let lastTime, accumulator = 0;
let gesture = null;
let fastMode = false;
let pendingDash = null;
let tacticCueTime = 0;
let challengeWins = 0;
let tutorial = { stage: 'intro', wallHits: 0, enemyKnocked: false, nextAt: null };
let fastModeTutorialDone = false;

function showTutorialConfirmation() {
  gesture = null;
  round.started = false;
  tutorialConfirm.hidden = false;
  tutorialConfirm.focus({ preventScroll: true });
}

function beginCombatPractice() {
  tutorial = { stage: 'combat', wallHits: 0, enemyKnocked: false, nextAt: null };
  tutorialInstruction.textContent = '칸타의 팽이는 교주의 팽이와 동시에 움직입니다';
  tutorialGoal.textContent = '행동하는 칸타의 팽이를 3번 벽에 부딪히게 하기';
  tutorialProgress.textContent = '0/' + TUTORIAL_HITS;
  showTutorialConfirmation();
}

function completeTutorial() {
  tutorial = null;
  tutorialPractice.hidden = true;
  tutorialSuccess.hidden = false;
  challengeIntro.hidden = true;
  beginButton.textContent = '본 게임 시작';
  round.started = false;
  ready.hidden = false;
  beginButton.focus();
}

function resetRound(started = false) {
  pendingDash = null;
  tacticCueTime = 0;
  delete tacticCue.dataset.cue;
  tacticCaption.textContent = '';
  tops = palette.map((color, index) => {
    const side = index ? 1 : -1;
    return {
      color, hp: MAX_HP, x: side * ARENA_RADIUS * .49, y: side * ARENA_RADIUS * .25,
      vx: 0, vy: 0, spin: random(0, TAU), direction: -side, phase: 'idle',
      stagger: 0, trail: []
    };
  });
  gesture = null;
  round = {
    elapsed: 0, started, enemyDashUntil: 0,
    playerDashUntil: 0, nextStrike: 0, shotTime: started && !tutorial ? SHOT_WINDOW : null,
    over: false, freeze: 0, shake: 0, enemyAttempt: null
  };
  sparks = [];
  hits = [];
  rings = [];
  accumulator = 0;
  lastTime = undefined;
  ready.hidden = started || Boolean(tutorial) || !fastModeGuide.hidden;
  result.hidden = true;
  updateShotClock();
  updateHud();
}

function updateHud() {
  tops.forEach((top, index) => {
    hud[index][0].textContent = top.hp + ' HP';
    hud[index][1].style.width = (top.hp / MAX_HP * 100) + '%';
  });
}

function finish() {
  if (round.over) return;
  round.over = true;
  gesture = null;
  updateShotClock();
  const [blue, red] = tops;
  const winner = blue.hp === red.hp ? null : blue.hp > red.hp ? blue : red;
  const won = winner === blue;
  challengeWins = won ? challengeWins + 1 : 0;
  const cleared = challengeWins === WINS_TO_CLEAR;
  verdict.textContent = cleared ? '게임 클리어!' : won ? '승리' : winner === red ? '패배' : '무승부';
  resultProgress.textContent = won
    ? challengeWins + ' / ' + WINS_TO_CLEAR + ' 승리'
    : '첫 판부터 다시 시작';
  rematchButton.textContent = cleared ? '처음부터' : won ? '다음 게임' : '다시하기';
  verdict.style.color = cleared ? '#ffe4a0' : winner?.color.light || '#f3eee2';
  result.hidden = false;
}

function updateTop(top, dt) {
  const isPlayer = top === tops[0];
  const dashUntil = isPlayer ? round.playerDashUntil : round.enemyDashUntil;
  top.stagger -= dt;
  if (top.phase === 'dash' && round.elapsed >= dashUntil) top.phase = 'idle';

  let drag = 1;
  if (top.stagger > 0) {
    drag = Math.exp(-1.5 * dt);
  } else if (top.phase === 'dodge') {
    const remaining = Math.max(0, dashUntil - round.elapsed);
    drag = remaining / (remaining + dt);
    if (remaining === 0) top.phase = 'idle';
  } else if (top.phase === 'idle') {
    drag = Math.exp(-IDLE_DRAG * dt);
  } else if (isPlayer) {
    drag = Math.exp(-PLAYER_DASH_DRAG * dt);
  }
  top.vx *= drag;
  top.vy *= drag;
  top.x += top.vx * dt;
  top.y += top.vy * dt;
  top.spin += top.direction * (15 + top.hp * .16) * dt;
  keepInside(top, true);
}

function keepInside(top, duringPlay = false) {
  const distance = Math.hypot(top.x, top.y);
  if (distance <= WALL_RADIUS) return;
  const nx = top.x / distance;
  const ny = top.y / distance;
  top.x = nx * WALL_RADIUS;
  top.y = ny * WALL_RADIUS;
  const outward = top.vx * nx + top.vy * ny;
  if (outward > 0) {
    const tutorialWallHit = duringPlay && tutorial?.enemyKnocked && top === tops[1];
    if (tutorialWallHit) tutorial.enemyKnocked = false;
    top.vx -= 1.52 * outward * nx;
    top.vy -= 1.52 * outward * ny;
    if (top.phase === 'dash' || top.phase === 'dodge') {
      top.phase = 'idle';
    }
    if (duringPlay && outward >= WALL_DAMAGE_SPEED) {
      const damage = Math.min(23, Math.round(5 + (outward - WALL_DAMAGE_SPEED) * .028));
      applyDamage(top, damage, top.x, '#ffcf82');
      updateHud();
      showImpact(top.x + nx * RADIUS, top.y + ny * RADIUS, '#ffb867');
      if (tutorialWallHit && tutorial.nextAt === null) {
        tutorial.wallHits++;
        tutorialProgress.textContent = tutorial.wallHits + '/' + TUTORIAL_HITS;
        if (tutorial.wallHits === TUTORIAL_HITS) tutorial.nextAt = round.elapsed + .85;
      }
    }
  }
}

function canStrike() {
  return round.started && !round.over && !pendingDash && (!tutorial || tutorial.nextAt === null) && tops.every(top => top.hp > 0)
    && round.elapsed >= round.nextStrike;
}

function updateJoystick(x, y) {
  const dx = x - gesture.startX;
  const dy = y - gesture.startY;
  const distance = Math.hypot(dx, dy);
  gesture.angle = Math.atan2(dy, dx);
  gesture.stickDistance = Math.min(distance, joystickRadius);
  gesture.power = clamp((distance - JOYSTICK_DEAD_ZONE) / (joystickRadius - JOYSTICK_DEAD_ZONE), 0, 1);
}

function dashDuration(power) {
  return .44 + power * .23;
}

function dashSpeed(power) {
  return 350 + power * 520;
}

function launch(top, angle, speed, phase = 'dash') {
  top.vx = Math.cos(angle) * speed;
  top.vy = Math.sin(angle) * speed;
  top.phase = phase;
  top.stagger = 0;
  top.trail = [];
}

function isWeakSideMove(player, enemy, angle, power) {
  const towardEnemy = Math.atan2(enemy.y - player.y, enemy.x - player.x);
  return power > 0 && power <= .4 && Math.abs(Math.cos(angle - towardEnemy)) <= .5;
}

function isAimedAtEnemy(player, enemy, angle) {
  const dx = enemy.x - player.x;
  const dy = enemy.y - player.y;
  const directionX = Math.cos(angle);
  const directionY = Math.sin(angle);
  const forwardDistance = dx * directionX + dy * directionY;
  const sidewaysDistance = Math.abs(dx * directionY - dy * directionX);
  return forwardDistance > sidewaysDistance && sidewaysDistance < RADIUS * 2;
}

function chooseEnemyMove(weakSideMove) {
  if (Math.random() >= .5) {
    return { tactic: 'dodge', power: random(.05, .23), preferredSide: Math.random() < .5 ? -1 : 1 };
  }
  if (weakSideMove && Math.random() >= .5) return { tactic: 'lead', power: random(.6, .95) };
  return { tactic: 'headOn', power: random(.6, .95) };
}

function distanceToWall(top, angle) {
  const along = top.x * Math.cos(angle) + top.y * Math.sin(angle);
  const outside = top.x * top.x + top.y * top.y - WALL_RADIUS * WALL_RADIUS;
  const discriminant = along * along - outside;
  if (discriminant < 0) return 0;
  return Math.max(0, -along + Math.sqrt(discriminant));
}

function predictAngle(player, enemy, playerAngle, playerPower, enemySpeed, enemyDuration) {
  const playerSpeed = dashSpeed(playerPower);
  const playerDuration = dashDuration(playerPower);
  const wallDistance = distanceToWall(player, playerAngle);
  const dx = Math.cos(playerAngle);
  const dy = Math.sin(playerAngle);
  function travelAt(time) {
    const dashTime = Math.min(time, playerDuration);
    const dashDecay = Math.exp(-PLAYER_DASH_DRAG * dashTime);
    const dashTravel = playerSpeed * (1 - dashDecay) / PLAYER_DASH_DRAG;
    const coastTime = time - dashTime;
    const coastTravel = playerSpeed * dashDecay * (1 - Math.exp(-IDLE_DRAG * coastTime)) / IDLE_DRAG;
    return Math.min(wallDistance, dashTravel + coastTravel);
  }

  let low = 0;
  let high = Math.min(.45, enemyDuration);
  for (let i = 0; i < 10; i++) {
    const time = (low + high) / 2;
    const lead = travelAt(time);
    const gap = Math.hypot(player.x + dx * lead - enemy.x, player.y + dy * lead - enemy.y);
    if (gap - RADIUS * 2 > enemySpeed * time) low = time;
    else high = time;
  }
  const lead = travelAt(high);
  return Math.atan2(player.y + dy * lead - enemy.y, player.x + dx * lead - enemy.x);
}

function planEnemyDash(player, enemy, move, playerAngle, playerPower) {
  const forward = Math.atan2(player.y - enemy.y, player.x - enemy.x);
  const duration = dashDuration(move.power);
  const speed = dashSpeed(move.power);
  if (move.tactic !== 'dodge') {
    const angle = move.tactic === 'lead'
      ? predictAngle(player, enemy, playerAngle, playerPower, speed, duration)
      : forward;
    return { angle, speed, duration, phase: 'dash', tactic: move.tactic };
  }

  const offset = Math.PI * .56 * move.preferredSide;
  const preferredAngle = forward + offset;
  const otherAngle = forward - offset;
  const preferredRoom = distanceToWall(enemy, preferredAngle);
  const otherRoom = distanceToWall(enemy, otherAngle);
  const stoppingDistance = speed * (duration / 2 + FIXED_STEP);
  const usePreferred = preferredRoom >= stoppingDistance + DODGE_WALL_MARGIN || preferredRoom >= otherRoom;
  const room = usePreferred ? preferredRoom : otherRoom;
  const safeSpeed = Math.max(0, room - DODGE_WALL_MARGIN) / (duration / 2 + FIXED_STEP);
  return { angle: usePreferred ? preferredAngle : otherAngle, speed: Math.min(speed, safeSpeed), duration, phase: 'dodge', tactic: move.tactic };
}

function showTacticCue(cue) {
  tacticCue.dataset.cue = cue;
  tacticCaption.textContent = TACTIC_CAPTIONS[cue];
  tacticCueTime = TACTIC_CUE_SECONDS;
}

function updateTacticCue(seconds) {
  if (!tacticCue.dataset.cue) return;
  tacticCueTime -= seconds;
  if (tacticCueTime > 0) return;
  delete tacticCue.dataset.cue;
  tacticCaption.textContent = '';
}

function resolveEnemyAttempt(success) {
  round.enemyAttempt = null;
  showTacticCue(success ? 'success' : 'fail');
}

function releaseDashes(playerDash, enemyDash, showEnemyAttempt) {
  const [player, enemy] = tops;
  round.enemyAttempt = null;
  if (playerDash) {
    launch(player, playerDash.angle, playerDash.speed);
    round.playerDashUntil = round.elapsed + playerDash.duration;
  }
  if (enemyDash) {
    if (tutorial) tutorial.enemyKnocked = false;
    launch(enemy, enemyDash.angle, enemyDash.speed, enemyDash.phase);
    round.enemyDashUntil = round.elapsed + enemyDash.duration;
    if (showEnemyAttempt) {
      round.enemyAttempt = {
        tactic: enemyDash.tactic,
        moved: enemyDash.speed > 0,
        endsAt: Math.max(round.enemyDashUntil, playerDash ? round.playerDashUntil : round.elapsed)
      };
    }
  }
  round.nextStrike = round.elapsed + PLAYER_STRIKE_INTERVAL;
}

function strike(angle, power, timedOut = false) {
  if ((!timedOut && power <= 0) || !canStrike()) return;
  const [player, enemy] = tops;
  const playerDash = power > 0 ? { angle, speed: dashSpeed(power), duration: dashDuration(power) } : null;
  const enemyActive = !tutorial || tutorial.stage === 'combat';
  const weakSideMove = isWeakSideMove(player, enemy, angle, power);
  const enemyMove = enemyActive ? chooseEnemyMove(weakSideMove) : null;
  const enemyDash = enemyMove ? planEnemyDash(player, enemy, enemyMove, angle, power) : null;
  const playerAttacksEnemy = Boolean(playerDash) && !weakSideMove && isAimedAtEnemy(player, enemy, angle);
  const showEnemyAttempt = (enemyMove?.tactic === 'dodge' && playerAttacksEnemy)
    || (enemyMove?.tactic === 'lead' && weakSideMove);
  if (showEnemyAttempt) {
    showTacticCue(enemyMove.tactic);
  } else if (enemyMove?.tactic === 'headOn' && weakSideMove) {
    showTacticCue('missed');
  }
  round.shotTime = null;
  if (playerDash && !fastMode && tutorial?.stage !== 'practice') {
    pendingDash = { playerDash, enemyDash, showEnemyAttempt, remaining: PATH_PREVIEW_SECONDS };
  } else {
    releaseDashes(playerDash, enemyDash, showEnemyAttempt);
  }
  updateShotClock();
}

function releasePreview() {
  const { playerDash, enemyDash, showEnemyAttempt } = pendingDash;
  pendingDash = null;
  accumulator = 0;
  releaseDashes(playerDash, enemyDash, showEnemyAttempt);
}

function collide() {
  const [a, b] = tops;
  const separation = Math.hypot(b.x - a.x, b.y - a.y);
  if (separation >= RADIUS * 2) return;
  if (round.enemyAttempt?.tactic === 'dodge') resolveEnemyAttempt(false);
  const nx = separation > .001 ? (b.x - a.x) / separation : 1;
  const ny = separation > .001 ? (b.y - a.y) / separation : 0;
  const playerApproach = a.vx * nx + a.vy * ny;
  const closing = playerApproach - (b.vx * nx + b.vy * ny);
  const push = (RADIUS * 2 - separation) / 2 + .1;
  a.x -= nx * push;
  a.y -= ny * push;
  b.x += nx * push;
  b.y += ny * push;
  if (closing <= 0) return;
  if (round.enemyAttempt?.tactic === 'lead') resolveEnemyAttempt(true);
  const wasDodging = b.phase === 'dodge';
  const dashImpact = closing >= 100 && (a.phase === 'dash' || b.phase === 'dash' || wasDodging);
  const force = closing * (dashImpact ? .98 : .8);
  a.vx -= nx * force;
  a.vy -= ny * force;
  b.vx += nx * force;
  b.vy += ny * force;
  if (wasDodging) b.phase = 'idle';
  if (!dashImpact) return;

  if (tutorial && (a.phase === 'dash' || (tutorial.stage === 'combat' && playerApproach > 0))) {
    tutorial.enemyKnocked = true;
  }
  a.phase = 'idle';
  b.phase = 'idle';
  a.stagger = b.stagger = .46;
  showImpact((a.x + b.x) / 2, (a.y + b.y) / 2, '#ffe3a6');
}

function applyDamage(top, damage, labelX, color) {
  const minHp = tutorial?.stage === 'combat' && top === tops[0] ? 1 : 0;
  const lost = Math.min(damage, Math.max(0, top.hp - minHp));
  if (lost === 0) return;
  top.hp -= lost;
  hits.push({ x: labelX, y: top.y - 24, lost, color, life: .85 });
}

function showImpact(x, y, color) {
  rings.push({ x, y, color, life: .37 });
  for (let i = 0; i < 18; i++) {
    const angle = random(0, TAU);
    const speed = random(55, 270);
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: random(.12, .43) });
  }
  round.freeze = reducedMotion.matches ? 0 : .055;
  round.shake = reducedMotion.matches ? 0 : .18;
}

function step(dt) {
  if (round.over) return;
  if (!round.started) {
    for (const top of tops) top.spin += top.direction * 18 * dt;
    return;
  }
  round.shake = Math.max(0, round.shake - dt);
  if (round.freeze > 0) {
    round.freeze -= dt;
    return;
  }
  for (const spark of sparks) {
    spark.x += spark.vx * dt;
    spark.y += spark.vy * dt;
    spark.life -= dt;
  }
  for (const hit of hits) { hit.y -= 37 * dt; hit.life -= dt; }
  for (const ring of rings) ring.life -= dt;
  sparks = sparks.filter(spark => spark.life > 0);
  hits = hits.filter(hit => hit.life > 0);
  rings = rings.filter(ring => ring.life > 0);

  round.elapsed += dt;
  if (tutorial && tutorial.nextAt !== null && round.elapsed >= tutorial.nextAt) {
    if (tutorial.stage === 'practice') beginCombatPractice();
    else completeTutorial();
    return;
  }
  if (tops.some(top => top.hp === 0)) {
    if (rings.length) return;
    if (!tutorial) {
      finish();
      return;
    }
    for (const top of tops) {
      if (top.hp !== 0) continue;
      top.hp = MAX_HP;
      top.vx = 0;
      top.vy = 0;
    }
    updateHud();
  }
  tops.forEach(top => updateTop(top, dt));
  const bothTopsAlive = tops.every(top => top.hp > 0);
  if (round.enemyAttempt?.tactic === 'lead' && (tops[1].phase !== 'dash' || !bothTopsAlive)) {
    resolveEnemyAttempt(false);
  }
  if (bothTopsAlive) collide();
  if (round.enemyAttempt?.tactic === 'dodge' && (round.elapsed >= round.enemyAttempt.endsAt || !bothTopsAlive)) {
    resolveEnemyAttempt(round.enemyAttempt.moved);
  }
  for (const top of tops) {
    top.trail.push({ x: top.x, y: top.y });
    if (top.trail.length > 21) top.trail.shift();
  }
}

function oval(x, y, rx, ry, fill, stroke, width = 1) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
}

function drawArena() {
  oval(0, 8, ARENA_RADIUS + 14, ARENA_RADIUS + 14, '#101216');
  oval(0, 0, ARENA_RADIUS + 12, ARENA_RADIUS + 12, '#2b3036', '#5b5c57', 1.4);
  oval(0, 0, ARENA_RADIUS + 4, ARENA_RADIUS + 4, '#444741', '#15191c', 2);
  const floor = ctx.createRadialGradient(0, -25, 10, 0, 0, ARENA_RADIUS);
  floor.addColorStop(0, '#2d3438');
  floor.addColorStop(1, '#191e24');
  oval(0, 0, ARENA_RADIUS - 6, ARENA_RADIUS - 6, floor, '#a69260', 1.4);

  ctx.save();
  ctx.clip();
  ctx.beginPath();
  for (let x = -Math.floor(ARENA_RADIUS / 24) * 24; x <= ARENA_RADIUS; x += 24) {
    ctx.moveTo(x, -ARENA_RADIUS);
    ctx.lineTo(x, ARENA_RADIUS);
  }
  for (let y = -Math.floor(ARENA_RADIUS / 24) * 24; y <= ARENA_RADIUS; y += 24) {
    ctx.moveTo(-ARENA_RADIUS, y);
    ctx.lineTo(ARENA_RADIUS, y);
  }
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#b9c4b510';
  ctx.stroke();
  oval(0, 0, ARENA_RADIUS * .78, ARENA_RADIUS * .78, null, '#d4c59b28');
  oval(0, 0, ARENA_RADIUS * .56, ARENA_RADIUS * .56, null, '#d4c59b18');
  oval(0, 0, 41, 41, null, '#e1cd9a32');
  oval(0, 0, 8, 8, null, '#e1cd9a56');
  ctx.restore();

  for (let i = 0; i < 40; i++) {
    const angle = i * TAU / 40;
    const x = Math.cos(angle);
    const y = Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(x * (ARENA_RADIUS + 7), y * (ARENA_RADIUS + 7));
    ctx.lineTo(x * (ARENA_RADIUS + 10), y * (ARENA_RADIUS + 10));
    ctx.strokeStyle = i % 5 === 0 ? '#e6d291' : '#777565';
    ctx.lineWidth = i % 5 === 0 ? 2 : 1;
    ctx.stroke();
  }
}

function drawTrail(top) {
  if (reducedMotion.matches || Math.hypot(top.vx, top.vy) < 85) return;
  const trail = top.trail;
  ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++) {
    const strength = i / trail.length;
    ctx.globalAlpha = strength * (top.phase === 'dash' || top.phase === 'dodge' ? .29 : .095);
    ctx.strokeStyle = top.color.bright;
    ctx.lineWidth = strength * 24;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawTop(top) {
  const color = top.color;
  const wobble = top.hp < 25 && !reducedMotion.matches ? Math.sin(top.spin * .64) * 3 : 0;
  ctx.save();
  ctx.translate(top.x, top.y);
  oval(2, 8, 29, 25, '#080a10a0');
  ctx.translate(wobble, 0);
  ctx.rotate(top.spin);
  oval(0, 0, RADIUS, RADIUS, color.dark, '#10141a', 2);
  for (let tooth = 0; tooth < 6; tooth++) {
    ctx.rotate(TAU / 6);
    ctx.beginPath();
    ctx.moveTo(12, -8);
    ctx.lineTo(19, -16);
    ctx.lineTo(25, -5);
    ctx.lineTo(24, 6);
    ctx.lineTo(15, 9);
    ctx.closePath();
    ctx.fillStyle = tooth % 2 === 0 ? color.bright : color.mid;
    ctx.fill();
  }
  oval(0, 0, 15, 15, color.mid, '#171d24', 2);
  oval(0, 0, 10, 10, color.dark, color.light, 1.6);
  ctx.fillStyle = color.light;
  ctx.fillRect(-1.5, -7, 3, 7);
  oval(0, 0, 3.5, 3.5, '#f8ebd1');
  ctx.restore();
}

function drawDashPath(top, dash, playerPath, opacity) {
  if (!dash || dash.speed <= 0) return;
  let travel = dash.speed * dash.duration;
  if (dash.phase === 'dodge') {
    travel *= .5;
  } else if (playerPath) {
    const remainingSpeed = dash.speed * Math.exp(-PLAYER_DASH_DRAG * dash.duration);
    travel = (dash.speed - remainingSpeed) / PLAYER_DASH_DRAG + remainingSpeed / IDLE_DRAG;
  } else {
    travel += dash.speed / IDLE_DRAG;
  }

  const length = Math.min(travel, distanceToWall(top, dash.angle));
  const tip = Math.max(length, RADIUS - 3);
  ctx.save();
  ctx.translate(top.x, top.y);
  ctx.rotate(dash.angle);
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = top.color.light;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  if (length > RADIUS + 6) {
    ctx.setLineDash([9, 8]);
    ctx.beginPath();
    ctx.moveTo(RADIUS + 3, 0);
    ctx.lineTo(length, 0);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  const arrow = Math.min(13, Math.max(7, (tip - RADIUS) / 2));
  ctx.beginPath();
  ctx.moveTo(tip - arrow, -arrow * .6);
  ctx.lineTo(tip, 0);
  ctx.lineTo(tip - arrow, arrow * .6);
  ctx.stroke();
  ctx.restore();
}

function drawAim() {
  if (!gesture || !canStrike()) return;
  const player = tops[0];
  const { angle, power } = gesture;
  if (power <= 0) return;
  const chargeColor = power >= .95 ? '#ffe4a0' : player.color.light;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(angle);
  ctx.strokeStyle = chargeColor;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const tip = RADIUS + 34 + 34 * power;
  ctx.beginPath();
  ctx.moveTo(RADIUS + 15, 0);
  ctx.lineTo(tip, 0);
  ctx.moveTo(tip - 11, -8);
  ctx.lineTo(tip, 0);
  ctx.lineTo(tip - 11, 8);
  ctx.stroke();
  ctx.restore();
}

function drawJoystick() {
  if (!gesture || !canStrike()) return;
  const { originX, originY, angle, stickDistance, power } = gesture;
  const stickX = Math.cos(angle) * stickDistance;
  const stickY = Math.sin(angle) * stickDistance;
  const color = power >= .95 ? '#ffe4a0' : '#a7efff';
  ctx.save();
  ctx.setTransform(density, 0, 0, density, 0, 0);
  ctx.translate(originX, originY);
  oval(0, 0, joystickRadius, joystickRadius, '#10192288', '#a7efff75', 1.5);
  oval(0, 0, 4, 4, '#d3f4ff');
  if (power > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, joystickRadius, -Math.PI / 2, -Math.PI / 2 + TAU * power);
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(stickX, stickY);
  ctx.lineWidth = 3;
  ctx.strokeStyle = color;
  ctx.stroke();
  oval(stickX, stickY, 11, 11, '#163442', color, 2);
  ctx.restore();
}

function updateShotClock() {
  const visible = canStrike() && round.shotTime !== null;
  shotClock.hidden = !visible;
  if (!visible) return;
  const seconds = String(Math.ceil(round.shotTime));
  if (shotSeconds.textContent !== seconds) shotSeconds.textContent = seconds;
  shotClock.dataset.urgent = String(round.shotTime <= 2);
}

function updateShotWindow(seconds) {
  if (tutorial || !canStrike()) return;
  if (round.shotTime === null) {
    round.shotTime = SHOT_WINDOW;
    return;
  }

  round.shotTime = Math.max(0, round.shotTime - seconds);
  if (round.shotTime > 0) return;
  const angle = gesture?.angle ?? 0;
  const power = gesture?.power ?? 0;
  gesture = null;
  strike(angle, power, true);
}

function drawVignette() {
  if (!gesture) return;
  ctx.save();
  ctx.setTransform(density, 0, 0, density, 0, 0);
  ctx.translate(drawWidth / 2, drawHeight / 2);
  ctx.scale(drawWidth / 2, drawHeight / 2);
  const shade = ctx.createRadialGradient(0, 0, .27, 0, 0, 1.22);
  shade.addColorStop(0, '#03050b00');
  shade.addColorStop(.55, '#03050b18');
  shade.addColorStop(1, '#03050bc9');
  ctx.fillStyle = shade;
  ctx.fillRect(-1, -1, 2, 2);
  ctx.restore();
}

function draw() {
  ctx.setTransform(density, 0, 0, density, 0, 0);
  ctx.clearRect(0, 0, drawWidth, drawHeight);
  if (!tops) return;
  const shake = gesture ? 0 : round.shake * 28;
  ctx.translate(drawWidth / 2 + Math.sin(round.elapsed * 123) * shake, arenaCenterY);
  ctx.scale(scale, scale);
  drawArena();
  if (!tutorialIntro.hidden || !tutorialConfirm.hidden) {
    const highlightedTop = tutorial?.stage === 'enemyIntro' ? 1 : 0;
    drawTop(tops[1 - highlightedTop]);
    ctx.save();
    ctx.setTransform(density, 0, 0, density, 0, 0);
    ctx.fillStyle = 'rgba(0, 0, 0, .68)';
    ctx.fillRect(0, 0, drawWidth, drawHeight);
    ctx.restore();
    drawTop(tops[highlightedTop]);
    return;
  }
  tops.forEach(drawTrail);
  for (const ring of rings) {
    ctx.globalAlpha = ring.life / .37;
    const radius = 13 + (1 - ctx.globalAlpha) * 49;
    oval(ring.x, ring.y, radius, radius, null, ring.color, 2);
  }
  ctx.globalAlpha = 1;
  tops.forEach(drawTop);
  if (pendingDash) {
    const previewElapsed = PATH_PREVIEW_SECONDS - pendingDash.remaining;
    const opacity = reducedMotion.matches ? 1 : .65 + .35 * Math.cos(previewElapsed * TAU * 2);
    drawDashPath(tops[0], pendingDash.playerDash, true, opacity);
    drawDashPath(tops[1], pendingDash.enemyDash, false, opacity);
  }
  if (!reducedMotion.matches) {
    for (const spark of sparks) {
      ctx.globalAlpha = Math.min(1, spark.life * 5);
      ctx.strokeStyle = '#ffd68d';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(spark.x, spark.y);
      ctx.lineTo(spark.x + spark.vx * .034, spark.y + spark.vy * .034);
      ctx.stroke();
    }
  }
  for (const hit of hits) {
    ctx.globalAlpha = Math.min(1, hit.life * 3);
    ctx.font = '900 21px system-ui';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#12151b';
    ctx.lineWidth = 4;
    ctx.strokeText('−' + hit.lost, hit.x, hit.y);
    ctx.fillStyle = hit.color;
    ctx.fillText('−' + hit.lost, hit.x, hit.y);
  }
  ctx.globalAlpha = 1;
  drawVignette();
  drawAim();
  drawJoystick();
}

function resize() {
  const bounds = canvas.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  if (drawWidth !== bounds.width || drawHeight !== bounds.height) gesture = null;
  drawWidth = bounds.width;
  drawHeight = bounds.height;
  density = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(drawWidth * density);
  canvas.height = Math.round(drawHeight * density);
  const playfieldTop = score.getBoundingClientRect().bottom - bounds.top;
  const playfieldHeight = Math.max(0, drawHeight - playfieldTop);
  arenaCenterY = (playfieldTop + drawHeight) / 2;
  scale = Math.min(drawWidth, playfieldHeight) / (2 * (ARENA_RADIUS + 25));
  joystickRadius = clamp(playfieldHeight * .25, 44, 68);
  draw();
}

function frame(now) {
  const seconds = Math.max(0, (now - (lastTime ?? now)) / 1000);
  lastTime = now;
  updateTacticCue(seconds);
  if (pendingDash) {
    pendingDash.remaining -= seconds;
    if (pendingDash.remaining <= 0) releasePreview();
  } else {
    accumulator += Math.min(seconds, .05) * (gesture ? CHARGE_SLOW_RATE : 1);
    while (accumulator >= FIXED_STEP) {
      accumulator -= FIXED_STEP;
      step(FIXED_STEP);
    }
    updateShotWindow(seconds);
  }
  updateShotClock();
  draw();
  requestAnimationFrame(frame);
}

function setFastMode(enabled) {
  fastMode = enabled;
  fastModeButton.setAttribute('aria-pressed', String(fastMode));
  if (fastMode && pendingDash) releasePreview();
}

let fullscreenStatusTimer;
fullscreenButton.addEventListener('click', async () => {
  clearTimeout(fullscreenStatusTimer);
  fullscreenStatus.textContent = '';
  try {
    if (document.fullscreenElement === stage) {
      await document.exitFullscreen();
    } else {
      await stage.requestFullscreen();
    }
  } catch {
    fullscreenStatus.textContent = '이 브라우저 또는 미리보기에서는 전체 화면을 사용할 수 없어요.';
    fullscreenStatusTimer = setTimeout(() => { fullscreenStatus.textContent = ''; }, 3500);
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreenButton.setAttribute('aria-pressed', String(document.fullscreenElement === stage));
});

function showFastModeTutorial() {
  setFastMode(false);
  fastModeGuide.hidden = false;
  fastModeButton.hidden = false;
  canvas.inert = true;
  resetRound();
  fastModeButton.setAttribute('aria-describedby', 'fastModeGuide');
  fastModeButton.focus();
}

fastModeButton.addEventListener('click', () => {
  setFastMode(!fastMode);
  if (fastModeGuide.hidden) return;
  fastModeTutorialDone = true;
  fastModeGuide.hidden = true;
  canvas.inert = false;
  fastModeButton.removeAttribute('aria-describedby');
  round.started = true;
  round.shotTime = SHOT_WINDOW;
  updateShotClock();
});
tutorialNext.addEventListener('click', () => {
  if (tutorialIntro.hidden) return;
  if (tutorial.stage === 'intro') {
    tutorial.stage = 'enemyIntro';
    tutorialIntroText.textContent = '이것은 칸타의 팽이입니다';
    return;
  }
  tutorial.stage = 'practice';
  tutorialIntro.hidden = true;
  tutorialPractice.hidden = false;
  round.started = true;
});
tutorialSkip.addEventListener('click', () => {
  if (tutorialIntro.hidden) return;
  tutorial = null;
  tutorialIntro.hidden = true;
  fastModeTutorialDone = true;
  fastModeButton.hidden = false;
  resetRound();
  beginButton.focus();
});
tutorialConfirm.addEventListener('click', () => {
  if (!tutorial || tutorialConfirm.hidden) return;
  tutorialConfirm.hidden = true;
  round.started = true;
});
beginButton.addEventListener('click', () => resetRound(true));
rematchButton.addEventListener('click', () => {
  if (!round.over) return;
  if (challengeWins === 1 && !fastModeTutorialDone) {
    showFastModeTutorial();
    return;
  }
  if (challengeWins === WINS_TO_CLEAR) challengeWins = 0;
  resetRound(true);
});
canvas.addEventListener('pointerdown', event => {
  if (gesture || event.button !== 0 || !canStrike()) return;
  const bounds = canvas.getBoundingClientRect();
  gesture = {
    id: event.pointerId, startX: event.clientX, startY: event.clientY,
    originX: event.clientX - bounds.left, originY: event.clientY - bounds.top,
    angle: 0, stickDistance: 0, power: 0
  };
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  if (gesture?.id !== event.pointerId) return;
  updateJoystick(event.clientX, event.clientY);
});
canvas.addEventListener('pointerup', event => {
  if (gesture?.id !== event.pointerId) return;
  updateJoystick(event.clientX, event.clientY);
  const { angle, power } = gesture;
  gesture = null;
  strike(angle, power);
});
for (const type of ['pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(type, event => {
    if (gesture?.id === event.pointerId) gesture = null;
  });
}
document.addEventListener('visibilitychange', () => {
  gesture = null;
  lastTime = undefined;
  accumulator = 0;
});
resize();
tutorialIntro.hidden = false;
resetRound();
new ResizeObserver(resize).observe(canvas);
requestAnimationFrame(frame);
</script>
</body>
</html>
